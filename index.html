<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173938">
  <meta name="description" content="درس‌بان؛ بانک منابع آموزشی، مسیر مطالعه، منتورینگ و حمایت دانشجویان نوورود رشته‌های علوم پزشکی">
  <meta name="application-name" content="درس‌بان">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <title>درس‌بان | منابع و راهبری آموزشی</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-frame">
    <aside id="desktop-sidebar" class="desktop-sidebar" aria-label="پیمایش اصلی"></aside>
    <div class="desktop-shell">
      <header id="desktop-topbar" class="desktop-topbar">
        <div class="desktop-page-title" id="desktop-page-title">خانه</div>
        <label class="desktop-search" aria-label="جست‌وجو">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.7"></circle><path d="m16 16 4.4 4.4"></path></svg>
          <input id="global-search" type="search" placeholder="جست‌وجوی درس، منبع یا موضوع" autocomplete="off">
          <button type="button" class="desktop-search-submit" data-action="global-search">جست‌وجو</button>
        </label>
        <div class="desktop-top-actions">
          <button class="icon-button" data-page="notifications" aria-label="اعلان‌ها"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path></svg></button>
          <button class="desktop-user" data-page="profile" aria-label="نمایش پروفایل"><span class="desktop-user-avatar">د</span><span><b>پروفایل نمایشی</b><small>پیش‌نمایش دانشجو</small></span></button>
        </div>
      </header>
      <div id="view" aria-live="polite"></div>
      <nav id="tabbar" class="tabbar" aria-label="پیمایش اصلی"></nav>
      <div id="toast" class="toast" role="status"></div>
      <div id="modal-root"></div>
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
